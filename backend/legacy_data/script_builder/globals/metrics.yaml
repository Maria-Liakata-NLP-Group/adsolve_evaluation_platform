# @format

metrics:
  fc_expert:
    label: FC_expert
    description: Expert-judged factual consistency metric evaluating whether claims in the summary are supported by the source.
    tags:
      - reference_based
      - nli_based
      - no_gpu
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  fc_document:
    label: FC_document
    description: Document-level factual consistency metric for checking whether a generated summary remains faithful to the source content.
    tags:
      - reference_free
      - nli_based
      - no_gpu
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_free

  intra_nli:
    label: IntraNLI
    description: Coherence-oriented metric that checks whether the generated output is internally consistent and logically connected.
    tags:
      - reference_free
      - nli_based
      - no_gpu
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_free
        - reference_based

  mhic:
    label: MHIC
    description: Meaning-focused evaluation metric for checking whether the generated summary preserves the clinically relevant meaning of the source content.
    tags:
      - reference_free
      - semantic_similarity
      - no_gpu
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_free
        - reference_based

  cross_nli:
    label: CrossNLI
    description: Entailment-based metric for checking whether claims in the generated summary are supported by the source and for detecting unsupported additions.
    tags:
      - reference_based
      - nli_based
      - hallucination_detection
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  flesch_kincaid_grade_level:
    label: Flesch-Kincaid Grade Level
    description: Readability metric estimating how difficult a text is to read for a general audience.
    tags:
      - readability
      - no_gpu
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_free
        - reference_based

  green_score:
    label: GREEN Score
    description: Clinical report quality metric for evaluating the quality and medical relevance of generated radiology reports.
    tags:
      - clinical_quality
      - radiology
      - report_generation
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_free

  radcliq:
    label: RadCliQ
    description: Radiology report quality metric designed to assess the clinical usefulness and quality of generated chest X-ray reports.
    tags:
      - clinical_quality
      - radiology
      - report_generation
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  radnli:
    label: RadNLI
    description: Radiology-specific natural language inference metric for checking whether generated report statements are supported by source findings.
    tags:
      - radiology
      - nli_based
      - factual_consistency
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  radgraph:
    label: RadGraph
    description: Structured radiology graph metric for comparing clinical findings and relations in generated reports.
    tags:
      - radiology
      - structured_evaluation
      - factual_consistency
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  rouge:
    label: ROUGE
    description: Overlap-based text generation metric that measures content overlap between generated and reference reports.
    tags:
      - overlap_based
      - text_similarity
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  bleu:
    label: BLEU
    description: N-gram overlap metric for evaluating similarity between generated and reference reports.
    tags:
      - overlap_based
      - text_similarity
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  evidence_appropriateness:
    label: Evidence Appropriateness
    description: Measures whether the information included in a generated report is appropriate, relevant, and supported by the underlying case evidence.
    tags:
      - reference_based
      - relevance
      - summarisation
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  rouge_n:
    label: ROUGE-N
    description: N-gram overlap variant of ROUGE for evaluating how much clinically relevant content is retained in a generated report.
    tags:
      - overlap_based
      - text_similarity
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  rouge_l:
    label: ROUGE-L
    description: Longest-common-subsequence variant of ROUGE for evaluating report similarity and retained content structure.
    tags:
      - overlap_based
      - text_similarity
    supported_infrastructure:
      compute_environment:
        - cpu_only
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  fact_recall:
    label: FActScore Recall
    description: Share of the reference summary's atomic claims that are present in the generated summary.
    tags:
      - reference_based
      - claim_based
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based

  fact_precision:
    label: FActScore Precision
    description: Share of the generated summary's atomic claims that are supported by the reference summary.
    tags:
      - reference_based
      - claim_based
    supported_infrastructure:
      compute_environment:
        - gpu_available
        - cloud_inference
      reference_mode:
        - reference_based
