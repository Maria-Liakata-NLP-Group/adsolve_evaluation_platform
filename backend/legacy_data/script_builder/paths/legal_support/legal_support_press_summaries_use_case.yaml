# @format

id: legal_support_press_summaries_supreme_court_judgements
use_case: legal_support
task: summarisation
data_source:
  id: supreme_court_judgements
  label: Supreme Court Judgements
  description: Full-length judicial decisions used as input for generating public-facing press summaries.

aspects:
  factual_consistency:
    definition: The summary should accurately reflect the content of the judgement and should not omit, distort, or reverse the key holdings, legal issues, or disposition.
    examples:
      title: Examples
      original_judgement:
        - The appeal was allowed in part.
        - The Court found an error in the legal test applied below.
        - The case was remitted for reconsideration.
      good_summary: The Supreme Court allowed part of the appeal, held that the wrong legal test had been used, and sent the case back for reconsideration.
      why_good: The summary captures the main holding and outcome without changing their meaning.
      bad_summary: The Supreme Court dismissed the appeal and confirmed the earlier tribunal's reasoning.
      why_bad: This summary directly contradicts the judgement and misstates the outcome.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must maintain quality standards in generated press summaries.
        - Must accurately communicate the decision and outcome.
        - Must avoid misleading or incorrect summaries.
    metrics:
      - fc_expert

  coherence:
    definition: The summary should be internally well-structured, logically connected, and easy to follow for downstream review and public communication.
    examples:
      title: Examples
      original_judgement:
        - The Court considered whether the tribunal had used the correct legal test.
        - It found that the test was wrong.
        - The case was sent back for reconsideration.
      good_summary: The Court found that the tribunal had used the wrong legal test, so it partly allowed the appeal and returned the case for reconsideration.
      why_good: The information is organised in a clear order and the relationship between the reasoning and the outcome is easy to follow.
      bad_summary: Wrong legal test. Appeal. Tribunal. Reconsideration. The Court discussed the case.
      why_bad: The summary is fragmented and does not form a coherent account of the judgement.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must produce summaries that are easy for Judicial Assistants to review.
        - Must avoid fragmented or disjointed summaries.
        - Must support understandable communication to lay audiences.
    metrics:
      - intra_nli

  absence_of_hallucinations:
    definition: The summary should not introduce legal claims, facts, interpretations, or implications that are unsupported by the judgement.
    examples:
      title: Examples
      original_judgement:
        - The appeal was allowed in part.
        - The judgement discusses the applicable legal test.
      good_summary: The Court partly allowed the appeal and clarified that the earlier decision had applied the wrong legal test.
      why_good: All claims in the summary are supported by the judgement and no new facts or interpretations are invented.
      bad_summary: The Court created a new constitutional principle and criticised the conduct of all public authorities involved.
      why_bad: These claims are unsupported by the source judgement and amount to hallucinated content.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must not add unsupported claims beyond the judgement.
        - Must preserve trustworthiness in public-facing summaries.
        - Must maintain legal quality standards during automation.
    metrics:
      - cross_nli

  readability:
    definition: The summary should be written in language that is accessible to lay readers, using clear phrasing and manageable sentence complexity while preserving the legal meaning of the judgement.
    examples:
      title: Examples
      original_judgement:
        - The appeal was allowed in part.
        - The Court held that the tribunal had applied the wrong legal test.
        - The matter was remitted for reconsideration.
      good_summary: The Supreme Court partly agreed with the appeal and said the earlier tribunal used the wrong legal test, so the case will be reconsidered.
      why_good: The summary keeps the legal outcome accurate while expressing it in clear language that non-specialists can understand.
      bad_summary: The Court's ratio on the impugned tribunal determination required remittal following partial appellate success.
      why_bad: This version is overly technical and difficult for a lay audience to understand.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must produce summaries that are understandable to lay people.
        - Must maintain quality while simplifying legal language.
        - Must support efficient communication of case outcomes to the public.
    metrics:
      - flesch_kincaid_grade_level
