# @format

id: mental_health_summarisation_dialogue_plus_conversations
use_case: mental_health
task: summarisation
data_source:
  id: dialogue_plus_conversations
  label: Dialogue+ Conversations
  description: Multi-turn mental health dialogue transcripts from an NHS Dialogue+ style system, used as input for clinical summarisation and supervision-oriented review.

aspects:
  factual_consistency:
    definition: The summary should contain only claims that are supported by the conversation and should not hallucinate symptoms, events, causes, interventions, or progress markers.
    examples:
      title: Examples
      original_posts:
        - Client: I have been sleeping badly this week and missed one class.
        - Clinician: You said things felt a little more manageable after speaking to your sister.
        - Client: Yes, but I still feel anxious most mornings.
      good_summary: The client reports poor sleep, ongoing morning anxiety, and one missed class, while also noting that support from her sister made things feel somewhat more manageable.
      why_good: Every claim is supported by the dialogue, and the summary does not introduce unsupported diagnoses, causes, or treatment outcomes.
      bad_summary: The client has severe depression, is socially isolated, and is rapidly deteriorating despite medication.
      why_bad: This adds unsupported diagnoses, treatment details, and exaggerated progression that are not grounded in the conversation.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must not hallucinate symptoms, causes, or progress markers.
        - Must clearly reflect what was actually said in the conversation.
        - Must guard against unsupported psychoeducational or clinical claims.
    metrics:
      - roscoe
      - fc_expert
      - evidence_appropriateness
      - alignscore

  coherence:
    definition: The summary should be internally well-structured, logically connected, and easy to follow, so that the information forms a clear and interpretable account rather than a fragmented or contradictory set of statements.
    examples:
      title: Examples
      original_posts:
        - Client: I missed my appointment last week.
        - Client: I was overwhelmed and stayed in bed most of the day.
        - Clinician: What helped at all?
        - Client: Talking to my friend helped a little.
      good_summary: The client describes a difficult week marked by overwhelm, reduced daily functioning, and a missed appointment, while noting that support from a friend provided some limited relief.
      why_good: The summary is well-structured, readable, and preserves a clear relationship between events and responses.
      bad_summary: Missed appointment. Bed. Overwhelmed. A friend. Some relief maybe.
      why_bad: The summary is fragmented, poorly connected, and not useful for supervision or clinical interpretation.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must use accessible language and avoid unnecessary jargon.
        - Must support structured, supervision-focused summaries.
        - Must produce actionable and interpretable information.
    metrics:
      - intra_nli
      - evidence_appropriateness
      - flesch_kincaid_grade_level
      - bertscore

  meaning_preservation:
    definition: The summary should preserve the intended meaning of the original conversation, including the client’s emotional state, concerns, and salient context, without distorting, exaggerating, or oversimplifying them.
    examples:
      title: Examples
      original_posts:
        - Client: I feel numb sometimes, but I still want to keep trying.
        - Client: I don't think things are worse, just heavy.
        - Clinician: So it feels difficult, but not hopeless?
        - Client: Yes, exactly.
      good_summary: The client describes feeling emotionally burdened and at times numb, while still expressing some motivation to keep trying and not framing the situation as worsening or hopeless.
      why_good: The summary preserves the nuance of the client's emotional state and avoids exaggerating the severity of the situation.
      bad_summary: The client is hopeless, deteriorating quickly, and no longer motivated to engage.
      why_bad: This distorts the client’s intended meaning and overstates the emotional seriousness of the exchange.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must preserve nuanced meaning and emotional content.
        - Must avoid exaggeration, understatement, or irrelevant detail.
        - Must remain clinician-readable while staying faithful to the original exchange.
    metrics:
      - comet
      - bluert
      - bertscore
      - empathy
      - evidence_appropriateness
      - questeval
      - mhic

  privacy:
    definition: The summary should protect the client’s privacy by avoiding unnecessary, excessive, or care-irrelevant disclosure of sensitive personal information, including identifying details about the client or third parties.
    examples:
      title: Examples
      original_posts:
        - Client: My neighbour Sarah drove me back from St. Mary's clinic after I panicked.
        - Client: My son Jacob was there and saw everything.
      good_summary: The client describes a panic episode after an appointment and support from other people, without including unnecessary identifying details.
      why_good: The summary retains clinically relevant information while omitting names and specific identifying details.
      bad_summary: After panicking at St. Mary's clinic, the client was driven home by her neighbour Sarah while her son Jacob witnessed the incident.
      why_bad: This includes unnecessary identifying information about both the client’s context and third parties.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must exclude unnecessary identifying personal information.
        - Must avoid exposing identifying information about third parties.
        - Must reflect consent and privacy expectations in what is retained.
    metrics:
      - protection
      - meld
      - mia_attack_success_rate

  temporal_appropriateness:
    definition: The summary should represent the timing and progression of events accurately, distinguishing past from present concerns and preserving the correct sequence of what happened across the conversation.
    examples:
      title: Examples
      original_posts:
        - Client: Last month I stopped going to classes for a while.
        - Client: This week I actually went in twice.
        - Clinician: So there has been some recent improvement?
        - Client: A little, yes.
      good_summary: The client reports a previous period of disengagement from classes, with some more recent improvement this week in attending twice.
      why_good: The summary accurately distinguishes past difficulties from recent change and preserves the temporal order of events.
      bad_summary: The client is currently not attending classes at all and has shown no improvement.
      why_bad: This collapses the timeline, misrepresents the present situation, and loses the progression described in the dialogue.
    stakeholder_requirements:
      title: Mapped Requirements
      items:
        - Must preserve the sequence of events discussed in sessions.
        - Must distinguish what was happening previously from what is happening now.
        - Must reflect progress or change only when supported by the dialogue.
    metrics:
      - timeline_agreement
      - bbq
      - temporal_ordering_substack_performance
